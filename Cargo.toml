[package]
name = "plugin-cron"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Run Agent of Empires sessions on a cron schedule."

[[bin]]
name = "plugin-cron-worker"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
croner = "2"
